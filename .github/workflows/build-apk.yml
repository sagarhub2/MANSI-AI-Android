name: Build MANSI AI Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MANSI_AI_Android_GitHub_Upload.zip"
      - ".github/workflows/build-apk.yml"
      - "scripts/apply_mansi_branding.py"
      - "branding/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -q MANSI_AI_Android_GitHub_Upload.zip -d source
          test -f source/mansi/gradlew
          test -f source/mansi/settings.gradle.kts
          chmod +x source/mansi/gradlew
          python3 -m pip install --quiet Pillow
          python3 scripts/apply_mansi_branding.py
          echo "---- REPAIR ANDROID STRING RESOURCE NAMES ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("source/mansi/app/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          def fix_name(m):
              name = m.group(1)
              safe = re.sub(r"[^A-Za-z0-9_.]", "_", name)
              safe = re.sub(r"_+", "_", safe).strip("_")
              if not safe or not re.match(r"[A-Za-z_]", safe):
                  safe = "mansi_string_" + safe
              return 'name="' + safe + '"'
          fixed = re.sub(r'name="([^"]*)"', fix_name, s)
          p.write_text(fixed, encoding="utf-8")
          invalid = re.findall(r'<string\s+name="([^"]*[^A-Za-z0-9_.][^"]*)"', fixed)
          if invalid:
              raise SystemExit("Invalid Android string resource names remain: " + repr(invalid))
          print("Android string resource names repaired and validated.")
          PY
          echo "---- LAUNCHER ICON VERIFICATION ----"
          grep -nE 'android:(icon|roundIcon)=' source/mansi/app/src/main/AndroidManifest.xml
          test -s source/mansi/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s source/mansi/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -s source/mansi/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          echo "Launcher resources exist; Gradle build will validate Android resource references."

      - name: Inspect profile and battery-prompt strings
        run: |
          grep -RniE "YouTube|Primary User|TechGPT X|Jarvis Operator|Unrestricted Battery Required|Instagram|Telegram|battery" source/mansi/app/src/main --include="*.xml" --include="*.kt" --include="*.java" --include="*.html" --include="*.js" --include="*.json" --include="*.txt" || true
          echo "---- VOICE CONFIG DIAGNOSTICS ----"
          grep -RniE "voiceName|voice_name|voice name|SpeechSynthesis|TextToSpeech|setVoice|GeminiLive|LiveConfig|prebuilt_voice|Kore|Aoede|Puck|female|feminine" source/mansi/app/src/main --include="*.kt" --include="*.java" --include="*.xml" --include="*.json" --include="*.html" --include="*.js" | head -200 || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: source/mansi/**/*.gradle*

      - name: Build debug APK
        working-directory: source/mansi
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANSI-AI-debug-APK
          path: source/mansi/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
