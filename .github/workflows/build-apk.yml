name: Build MANSI AI Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MANSI_AI_Android_GitHub_Upload.zip"
      - ".github/workflows/build-apk.yml"
      - "scripts/apply_mansi_branding.py"
      - "branding/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -q MANSI_AI_Android_GitHub_Upload.zip -d source
          test -f source/mansi/gradlew
          test -f source/mansi/settings.gradle.kts
          chmod +x source/mansi/gradlew
          python3 -m pip install --quiet Pillow
          cp -a source/mansi/app/src/main/java /tmp/mansi-java-original
          python3 scripts/apply_mansi_branding.py
          # The legacy branding sweep rewrites Kotlin source literals and corrupts syntax across multiple files.
          # Restore all Java/Kotlin source; user-facing branding is handled in Android resources and assets.
          rm -rf source/mansi/app/src/main/java
          cp -a /tmp/mansi-java-original source/mansi/app/src/main/java
          echo "---- APPLY REQUESTED MANSI AI / SAGAR BRANDING ----"
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/mansi/app/src/main")
          replacements = [
              ("Jarvis system Authorized MANSI AI", "Mansi system Authorized MANSI AI"),
              ("Jarvis Autonomous device control", "Mansi AI Autonomous device control"),
              ("MANSI AI OS . TECHGPT X", "MANSI AI . SAGAR"),
              ("Jarvis Autonomous Device Control", "Mansi AI Autonomous device control"),
              ("Jarvis System Authorized", "Mansi system Authorized MANSI AI"),
              ("Jarvis OS . TECHGPT X", "MANSI AI . SAGAR"),
              ("TechGPT X", "TECHGPT X"),
              ("TechGPTX", "TECHGPT X"),
              ("Jarvis sagar neural Assistant", "Mansi AI sagar neural Assistant"),
              ("Jarvis operator . Primary", "Mansi AI operator . Primary"),
              ("Jarvis pro . Puck", "Mansi AI pro . Puck"),
          ]
          suffixes = {".xml", ".kt", ".java", ".html", ".js", ".json", ".txt", ".properties"}
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              try:
                  before = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              after = before
              for old, new in replacements:
                  after = after.replace(old, new)
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  print("Updated branding:", path)
          PY
          echo "---- APPLY PROFILE LINK CHANGES AND REMOVE YOUTUBE PROFILE LINKS ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mansi/app/src/main/java/com/jarvis/assistant/ui/settings")
          instagram = "https://instagram.com/hyee__sagar"
          telegram = "https://t.me/H_sagarr"
          targets = {
              "SettingsFragment.kt": [
                  ("https://www.instagram.com/techgptx.ai", instagram),
                  ("https://instagram.com/techgptx.ai", instagram),
              ],
              "PrivacyShieldActivity.kt": [
                  ("https://www.instagram.com/techgptx.ai", instagram),
                  ("https://instagram.com/techgptx.ai", instagram),
              ],
          }
          for filename, replacements in targets.items():
              path = root / filename
              if not path.exists():
                  print("Profile screen not found; skipping:", path)
                  continue
              source = path.read_text(encoding="utf-8")
              before = source
              for old, new in replacements:
                  source = source.replace(old, new)
              if filename == "SettingsFragment.kt":
                  source = re.sub(
                      r'binding\.btnSocialTelegram\.setOnClickListener \{.*?\n        \}',
                      'binding.btnSocialTelegram.setOnClickListener {\n            openUrl("' + telegram + '")\n        }',
                      source, count=1, flags=re.S
                  )
                  if "binding.btnSocialYoutube.visibility = android.view.View.GONE" not in source:
                      source = source.replace(
                          "binding.btnSocialYoutube.setOnClickListener {",
                          "binding.btnSocialYoutube.visibility = android.view.View.GONE\n        binding.btnSocialYoutube.setOnClickListener {",
                          1
                      )
              else:
                  source = re.sub(
                      r'binding\.btnJoinOfficialTelegram\.setOnClickListener \{.*?\n        \}',
                      'binding.btnJoinOfficialTelegram.setOnClickListener {\n            openUrl("' + telegram + '")\n        }',
                      source, count=1, flags=re.S
                  )
                  source = re.sub(
                      r'binding\.btnJoinTelegram\.setOnClickListener \{.*?\n        \}',
                      'binding.btnJoinTelegram.setOnClickListener {\n            openUrl("' + telegram + '")\n        }',
                      source, count=1, flags=re.S
                  )
                  if "binding.btnJoinYoutube.visibility = android.view.View.GONE" not in source:
                      source = source.replace(
                          "binding.btnJoinYoutube.setOnClickListener {",
                          "binding.btnJoinYoutube.visibility = android.view.View.GONE\n        binding.btnJoinYoutube.setOnClickListener {",
                          1
                      )
              if source != before:
                  path.write_text(source, encoding="utf-8")
                  print("Updated profile links / removed YouTube shortcut:", path)
          PY
          echo "---- APPLY SAFE VISIBLE BRANDING TO SOURCE RESOURCES ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mansi/app/src/main")
          # Only update visible text attributes and string resource values;
          # leave Kotlin source, package names, IDs and drawable references alone.
          patterns = [
              (re.compile(r'(?i)(android:text=")[^"]*jarvis[^"]*(")'), r'\1MANSI AI\2'),
              (re.compile(r'(?i)(android:contentDescription=")[^"]*jarvis[^"]*(")'), r'\1MANSI AI\2'),
              (re.compile(r'(?i)(<string\b[^>]*>)[^<]*jarvis[^<]*(</string>)'), r'\1MANSI AI\2'),
          ]
          for path in root.rglob("*.xml"):
              if path.name == "AndroidManifest.xml":
                  continue
              try:
                  before = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              after = before
              for pattern, replacement in patterns:
                  after = pattern.sub(replacement, after)
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  print("Updated visible branding:", path)
          PY
          echo "---- REPAIR ANDROID STRING RESOURCE NAMES ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("source/mansi/app/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          if '<string name="chat_label_jarvis">' not in s:
              s = s.replace("</resources>", '    <string name="chat_label_jarvis">MANSI AI</string>\\n</resources>')
              p.write_text(s, encoding="utf-8")
              s = p.read_text(encoding="utf-8")
          def fix_name(m):
              name = m.group(1)
              safe = re.sub(r"[^A-Za-z0-9_.]", "_", name)
              safe = re.sub(r"_+", "_", safe).strip("_")
              if not safe or not re.match(r"[A-Za-z_]", safe):
                  safe = "mansi_string_" + safe
              return 'name="' + safe + '"'
          fixed = re.sub(r'name="([^"]*)"', fix_name, s)
          p.write_text(fixed, encoding="utf-8")
          names = re.findall(r'<string\s+name="([^"]*)"', fixed)
          invalid = [name for name in names if not re.fullmatch(r"[A-Za-z0-9_.]+", name)]
          if invalid:
              raise SystemExit("Invalid Android string resource names remain: " + repr(invalid))
          print("Android string resource names repaired and validated.")
          PY
          echo "---- LAUNCHER ICON VERIFICATION ----"
          grep -nE 'android:(icon|roundIcon)=' source/mansi/app/src/main/AndroidManifest.xml
          test -s source/mansi/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s source/mansi/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -s source/mansi/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          echo "Launcher resources exist; Gradle build will validate Android resource references."

      - name: Inspect profile and battery-prompt strings
        run: |
          grep -RniE "YouTube|Primary User|TechGPT X|Jarvis Operator|Unrestricted Battery Required|Instagram|Telegram|battery" source/mansi/app/src/main --include="*.xml" --include="*.kt" --include="*.java" --include="*.html" --include="*.js" --include="*.json" --include="*.txt" || true
          echo "---- VOICE CONFIG DIAGNOSTICS ----"
          grep -RniE "voiceName|voice_name|voice name|SpeechSynthesis|TextToSpeech|setVoice|GeminiLive|LiveConfig|prebuilt_voice|Kore|Aoede|Puck|female|feminine" source/mansi/app/src/main --include="*.kt" --include="*.java" --include="*.xml" --include="*.json" --include="*.html" --include="*.js" | head -200 || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: source/mansi/**/*.gradle*

      - name: Build debug APK
        working-directory: source/mansi
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANSI-AI-debug-APK
          path: source/mansi/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
