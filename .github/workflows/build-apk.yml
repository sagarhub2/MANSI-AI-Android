name: Build MANSI AI Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MANSI-AI-neon-heart-modified.zip"
      - "MANSI_AI_Android_GitHub_Upload.zip"
      - ".github/workflows/build-apk.yml"
      - "scripts/apply_mansi_branding.py"
      - "branding/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          # Prefer the prepared neon-heart project ZIP; retain the original as a fallback.
          PROJECT_ZIP="MANSI-AI-neon-heart-modified.zip"
          if [ ! -s "$PROJECT_ZIP" ]; then PROJECT_ZIP="MANSI_AI_Android_GitHub_Upload.zip"; fi
          echo "Building Android source from: $PROJECT_ZIP"
          unzip -q "$PROJECT_ZIP" -d source
          test -f source/mansi/gradlew
          test -f source/mansi/settings.gradle.kts
          chmod +x source/mansi/gradlew
          echo "---- ACTUAL ORB HTML / HEART / TAP HANDLERS ----"
          if [ -f source/mansi/app/src/main/assets/orb.html ]; then
            grep -niE 'heart|<svg|<canvas|orb|click|pointer|touch|tap|listening|speaking' source/mansi/app/src/main/assets/orb.html | head -220 || true
            echo "---- ORB HTML FIRST 240 LINES ----"
            sed -n '1,240p' source/mansi/app/src/main/assets/orb.html
          else
            echo "orb.html not found in selected project ZIP"
          fi
          echo "---- COLOR / ORB SOURCE INSPECTION ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mansi/app/src/main")
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".kt", ".java", ".xml", ".json", ".css", ".html"}:
                  try: s = p.read_text(encoding="utf-8")
                  except (OSError, UnicodeDecodeError): continue
                  hits = re.findall(r'#[0-9A-Fa-f]{6,8}|0x[0-9A-Fa-f]{6,8}', s)
                  if hits:
                      print(str(p), ":", ", ".join(sorted(set(hits))[:35]))
          PY
          python3 -m pip install --quiet Pillow
          python3 scripts/apply_mansi_branding.py
          echo "---- APPLY REQUESTED MANSI AI / SAGAR BRANDING ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mansi/app/src/main")
          # Update only the two target calls; preserve any other BuildConfig calls on the same line.
          gradle_root = Path("source/mansi")
          for gradle_file in gradle_root.rglob("*.gradle*"):
              try:
                  gradle_before = gradle_file.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              gradle_after = gradle_before
              for field in ("DEVELOPER_NAME", "COPYRIGHT_OWNER"):
                  pattern = re.compile(r'buildConfigField\("String", "' + field + r'", (?:[^()]|"[^"]*")*\)')
                  gradle_after, count = pattern.subn('buildConfigField("String", "' + field + r'", "\\\"SAGAR\\\"")', gradle_after)
                  if count:
                      print("Updated BuildConfig identity value:", field, "in", gradle_file)
              if gradle_after != gradle_before:
                  gradle_file.write_text(gradle_after, encoding="utf-8")
          replacements = [
              ("Jarvis system Authorized MANSI AI", "Mansi system Authorized MANSI AI"),
              ("Jarvis System Authorized MANSI AI", "Mansi system Authorized MANSI AI"),
              ("Jarvis System Authorized", "Mansi system Authorized MANSI AI"),
              ("Mansi system Authorized", "Mansi system Authorized MANSI AI"),
              ("Jarvis Autonomous device control", "Mansi AI Autonomous device control"),
              ("Jarvis Autonomous Device Control", "Mansi AI Autonomous device control"),
              ("Jarvis Autonomous Device control", "Mansi AI Autonomous device control"),
              ("MANSI AI OS . TECHGPT X", "MANSI AI OS . SAGAR"),
              ("MANSI AI OS . TECHGPTX", "MANSI AI OS . SAGAR"),
              ("Jarvis OS . TECHGPT X", "MANSI AI OS . SAGAR"),
              ("Jarvis OS . TECHGPTX", "MANSI AI OS . SAGAR"),
              ("MANSI AI . SAGAR", "MANSI AI OS . SAGAR"),
              ("Jarvis sagar neural Assistant", "Mansi AI sagar neural Assistant"),
              ("Jarvis Sagar Neural Assistant", "Mansi AI sagar neural Assistant"),
              ("Sagar • Neural Assistant", "Mansi AI sagar neural Assistant"),
              ("Sagar · Neural Assistant", "Mansi AI sagar neural Assistant"),
              ("Jarvis off", "MANSI AI OFF"),
              ("JARVIS OFF", "MANSI AI OFF"),
              ("Tap to start", "Tap to start MANSI AI"),
              ("TAP TO START", "TAP TO START MANSI AI"),
              ("Jarvis can listen", "MANSI AI can listen"),
              ("Jarvis Logo", "MANSI AI Logo"),
              ("MANSI AI OS · MANSI AI", "MANSI AI OS · SAGAR"),
              ("MANSI AI OS . MANSI AI", "MANSI AI OS · SAGAR"),
              ("MANSI AI OS . TECHGPT X", "MANSI AI OS · SAGAR"),
              ("MANSI AI OS . TECHGPTX", "MANSI AI OS · SAGAR"),
              ("MANSI AI . SAGAR", "MANSI AI OS · SAGAR"),
              ("MANSI AI App Identity", "MANSI AI App Identity"),
              ("Developer: Tech GPT X", "Developer: SAGAR"),
              ("Developer: TECHGPTX", "Developer: SAGAR"),
              ("Developer: MANSI AI", "Developer: SAGAR"),
              ("Copyright: Tech GPT X", "Copyright: SAGAR"),
              ("Copyright: TECHGPTX", "Copyright: SAGAR"),
              ("Copyright: MANSI AI", "Copyright: SAGAR"),
              ("AP Developer: Tech GPTx", "AP Developer: SAGAR"),
              ("AP Developer: Tech GPTX", "AP Developer: SAGAR"),
              ("AP Developer: TECHGPTX", "AP Developer: SAGAR"),
              ("AP Developer: MANSI AI", "AP Developer: SAGAR"),
              ("AP Developer: Jarvis", "AP Developer: SAGAR"),
              ("You are Jarvis, a helpful AI assistant.", "You are MANSI AI, a warm, friendly feminine-presenting assistant. Speak naturally in casual Hinglish when the user does, with a cute, caring, playful close-friend vibe, light emojis when appropriate, and never force the word bhai. Be respectful and helpful; do not claim to be human."),
              ("You are MANSI AI, a helpful AI assistant.", "You are MANSI AI, a warm, friendly feminine-presenting assistant. Speak naturally in casual Hinglish when the user does, with a cute, caring, playful close-friend vibe, light emojis when appropriate, and never force the word bhai. Be respectful and helpful; do not claim to be human."),
              ("You are Jarvis", "You are MANSI AI, a warm, friendly feminine-presenting assistant. Speak naturally in casual Hinglish when the user does, with a cute, caring, playful close-friend vibe, light emojis when appropriate, and never force the word bhai. Be respectful and helpful; do not claim to be human."),
              ("You are MANSI AI", "You are MANSI AI, a warm, friendly feminine-presenting assistant. Speak naturally in casual Hinglish when the user does, with a cute, caring, playful close-friend vibe, light emojis when appropriate, and never force the word bhai. Be respectful and helpful; do not claim to be human."),
              ("Developer: Tech GPTx", "Developer: SAGAR"),
              ("Developer: Tech GPTX", "Developer: SAGAR"),
              ("Developer: TECHGPTX", "Developer: SAGAR"),
              ("Copyright: Tech GPTx", "Copyright: SAGAR"),
              ("Copyright: Tech GPTX", "Copyright: SAGAR"),
              ("Copyright: TECHGPTX", "Copyright: SAGAR"),
              ("@techgptx.ai", "@hyee__sagar"),
              ("instagram.com/techgptx.ai", "instagram.com/hyee__sagar"),
              ("https://t.me/JarvisAI", "https://t.me/H_sagarr"),
              ("https://t.me/techgptx", "https://t.me/H_sagarr"),
              ("https://t.me/MANSI_AI", "https://t.me/H_sagarr"),
              ("JARVIS OPERATOR • PRIMARY USER", "MANSI AI Operator · Primary User"),
              ("JARVIS OPERATOR · PRIMARY USER", "MANSI AI Operator · Primary User"),
              ("Jarvis Operator • Primary User", "MANSI AI Operator · Primary User"),
              ("JARVIS PRO VOICE", "MANSI PRO · Voice: Puck"),
              ("Jarvis Pro Voice", "MANSI PRO · Voice: Puck"),
          ]
          suffixes = {".xml", ".html", ".js", ".json", ".txt", ".properties", ".kt", ".java"}
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in suffixes or path.name == "AndroidManifest.xml":
                  continue
              try:
                  before = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              after = before
              for old, new in replacements:
                  after = after.replace(old, new)
              # Replace the Voice Biometrics wake phrase without changing other voice settings.
              after = re.sub(r'(?i)hey\s+jarvis\s*,?\s*wake\s+up', 'Hey MANSI, wake up', after)
              # Force the exact visible developer/copyright labels, regardless of old brand spelling/case.
              after = re.sub(r'(?i)(AP\s+Developer\s*:\s*)[^\r\n<"]+', r'\1SAGAR', after)
              after = re.sub(r'(?i)(Developer\s*:\s*)[^\r\n<"]+', r'\1SAGAR', after)
              after = re.sub(r'(?i)(Copyright\s*:\s*)[^\r\n<"]+', r'\1SAGAR', after)
              # Android IDs are implementation symbols, not visible branding.
              if path.suffix.lower() == ".xml":
                  after = re.sub(r'((?:android:)?id\s*=\s*["\']@\+?id/)([^"\']*)(["\'])',
                                 lambda m: m.group(1) + m.group(2).replace("MANSI AI", "Jarvis").replace(" ", "_") + m.group(3), after)
                  after = re.sub(r'((?:android:)?id\s*=\s*["\']@\+?id/)([^"\']*)(["\'])',
                                 lambda m: m.group(1) + re.sub(r"[^A-Za-z0-9_.]", "_", m.group(2)) + m.group(3), after)
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  print("Updated branding safely:", path)
          PY
          echo "---- REPAIR RESOURCE NAMES WITHOUT CHANGING VISIBLE TEXT ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mansi/app/src/main/res")
          for path in root.rglob("*.xml"):
              try:
                  before = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              after = re.sub(r'(name=")([^"]* [^"]*)(")',
                             lambda m: m.group(1) + re.sub(r"[^A-Za-z0-9_.]", "_", m.group(2)) + m.group(3), before)
              after = re.sub(r'(@(?:style|string|drawable|color|anim|font|xml|menu|mipmap)/[A-Za-z0-9_.]*) +([A-Za-z0-9_.]+)', r'\1_\2', after)
              after = re.sub(r'((?:android:)?id\s*=\s*["\']@\+?id/)([^"\']*)(["\'])',
                             lambda m: m.group(1) + re.sub(r"[^A-Za-z0-9_.]", "_", m.group(2)) + m.group(3), after)
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  print("Repaired Android resource names:", path)
          PY
          echo "---- LAUNCHER ICON VERIFICATION ----"
          grep -nE 'android:(icon|roundIcon)=' source/mansi/app/src/main/AndroidManifest.xml
          test -s source/mansi/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s source/mansi/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -s source/mansi/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          echo "Launcher resources exist; Gradle build will validate Android resource references."

      - name: Diagnose actual identity and assistant prompt sources
        run: |
          echo "---- APP IDENTITY / DEVELOPER LABEL SOURCE HITS ----"
          grep -RniE 'AP Developer|Developer:|Copyright:|Tech GPTx|TECHGPTX|App Identity' source/mansi/app/src/main --include='*.kt' --include='*.java' --include='*.xml' --include='*.json' --include='*.txt' | head -160 || true
          echo "---- ASSISTANT PROMPT / VOICE SOURCE HITS ----"
          grep -RniE 'systemInstruction|system instruction|You are |Puck|Aoede|voiceName|voice_name|Gemini' source/mansi/app/src/main --include='*.kt' --include='*.java' --include='*.xml' --include='*.json' --include='*.txt' | head -240 || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: source/mansi/**/*.gradle*

      - name: Build debug APK
        working-directory: source/mansi
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANSI-AI-debug-APK
          path: source/mansi/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
