name: Build MANSI AI Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MANSI-AI-neon-heart-modified.zip"
      - "MANSI_AI_Android_GitHub_Upload.zip"
      - "MANSI-AI-Android-voice-latency-patch.zip"
      - ".github/workflows/build-apk.yml"
      - "scripts/apply_mansi_branding.py"
      - "scripts/fix_mansi_identity.py"
      - "scripts/fix_mansi_notifications.py"
      - "scripts/apply_mansi_orb.py"
      - "scripts/add_mansi_tap_feedback.py"
      - "scripts/apply_mansi_full_redesign.py"
      - "scripts/fix_overlay_avatar_gallery.py"
      - "scripts/apply_mansi_anime_avatar.py"
      - "scripts/add_mansi_avatar_lipsync.py"
      - "branding/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          # Prefer the prepared neon-heart project ZIP; retain the original as a fallback.
          PROJECT_ZIP="MANSI-AI-neon-heart-modified.zip"
          if [ ! -s "$PROJECT_ZIP" ]; then PROJECT_ZIP="MANSI_AI_Android_GitHub_Upload.zip"; fi
          echo "Building Android source from: $PROJECT_ZIP"
          unzip -q "$PROJECT_ZIP" -d source
          # Apply the dedicated low-latency audio queue fix from the uploaded patch archive.
          if [ -s "MANSI-AI-Android-voice-latency-patch.zip" ]; then
            mkdir -p voice-patch
            unzip -q "MANSI-AI-Android-voice-latency-patch.zip" -d voice-patch
            PATCH_AUDIO="voice-patch/mansi/app/src/main/java/com/jarvis/assistant/audio/AudioPlayer.kt"
            TARGET_AUDIO="source/mansi/app/src/main/java/com/jarvis/assistant/audio/AudioPlayer.kt"
            test -s "$PATCH_AUDIO"
            test -s "$TARGET_AUDIO"
            cp "$PATCH_AUDIO" "$TARGET_AUDIO"
            echo "Applied low-latency AudioPlayer queue patch"
          else
            echo "::error::Voice latency patch archive is missing"
            exit 1
          fi
          test -f source/mansi/gradlew
          test -f source/mansi/settings.gradle.kts
          chmod +x source/mansi/gradlew
          echo "---- INSPECT PERSONA SELECTOR / ACTIVE PERSONA MAPPING ----"
          grep -RniE 'Persona:|Jarvis.*Active|Mansi.*Active|activePersona|active_persona|personaId|persona_id|selectedPersona|selected_persona|persona.*Jarvis|Jarvis.*persona|Mansi.*persona' source/mansi/app/src/main --include='*.kt' --include='*.java' --include='*.xml' --include='*.json' --include='*.html' --include='*.js' --include='*.txt' --include='*.properties' | head -300 || true
          echo "---- END PERSONA MAPPING INSPECTION ----"
          echo "---- FIX MISSING OVERLAY AVATAR GALLERY ----"
          python3 scripts/fix_overlay_avatar_gallery.py
          echo "---- OVERLAY AVATAR ACTIVITY SOURCE ----"
          sed -n '1,300p' source/mansi/app/src/main/java/com/jarvis/assistant/ui/settings/OverlayAvatarActivity.kt
          echo "---- OVERLAY AVATAR GALLERY HTML ----"
          sed -n '1,320p' source/mansi/app/src/main/assets/overlay-toys/gallery.html
          echo "---- OVERLAY AVATAR LAYOUT SOURCE ----"
          sed -n '1,300p' source/mansi/app/src/main/res/layout/activity_overlay_avatar.xml
          echo "---- OVERLAY AVATAR DRAWABLES / ASSETS ----"
          find source/mansi/app/src/main/res/drawable source/mansi/app/src/main/assets -maxdepth 3 -type f 2>/dev/null | grep -iE 'avatar|overlay|companion|toy|character' | head -160 || true
          echo "---- ACTUAL ORB HTML / HEART / TAP HANDLERS ----"
          if [ -f source/mansi/app/src/main/assets/orb.html ]; then
            grep -niE 'heart|<svg|<canvas|orb|click|pointer|touch|tap|listening|speaking' source/mansi/app/src/main/assets/orb.html | head -220 || true
            echo "---- ORB HTML FIRST 240 LINES ----"
            sed -n '1,240p' source/mansi/app/src/main/assets/orb.html
          else
            echo "orb.html not found in selected project ZIP"
          fi
          echo "---- NATIVE HOME ORB IMPLEMENTATION ----"
          grep -RniE 'heart|orb|naira_mic_center|bg_jarvis_orb|setOnClickListener|onTouch|ObjectAnimator|ValueAnimator' source/mansi/app/src/main/java/com/jarvis/assistant/ui/home source/mansi/app/src/main/res/layout source/mansi/app/src/main/res/drawable --include='*.kt' --include='*.xml' | head -300 || true
          echo "---- COLOR / ORB SOURCE INSPECTION ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mansi/app/src/main")
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".kt", ".java", ".xml", ".json", ".css", ".html"}:
                  try: s = p.read_text(encoding="utf-8")
                  except (OSError, UnicodeDecodeError): continue
                  hits = re.findall(r'#[0-9A-Fa-f]{6,8}|0x[0-9A-Fa-f]{6,8}', s)
                  if hits:
                      print(str(p), ":", ", ".join(sorted(set(hits))[:35]))
          PY
          python3 -m pip install --quiet Pillow
          python3 scripts/apply_mansi_branding.py
          echo "---- APPLY MANSI ASSISTANT IDENTITY FIX ----"
          python3 scripts/fix_mansi_identity.py
          echo "---- ENFORCE FEMININE MANSI CHAT PERSONA AND GEMINI VOICE ----"
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/mansi/app/src/main")
          suffixes = {".kt", ".java", ".xml", ".json", ".html", ".js", ".txt", ".properties"}
          replacements = [
              ("Voice: Puck", "Voice: Kore"),
              ('voiceName = "Puck"', 'voiceName = "Kore"'),
              ('voiceName: "Puck"', 'voiceName: "Kore"'),
              ('"voiceName": "Puck"', '"voiceName": "Kore"'),
              ('"name": "Puck"', '"name": "Kore"'),
              ("You are MANSI AI", "You are MANSI AI, a distinctly feminine virtual assistant. Always speak and write in a natural feminine voice and persona. In Hinglish, use feminine self-reference such as 'kar rahi hoon', 'bata sakti hoon', and 'main sun rahi hoon', never masculine forms like 'kar raha hoon'. Be warm, playful, expressive, caring, lightly teasing, and conversational; avoid robotic 'Sir, orders ka wait' phrasing. Keep the user's language and context, and do not overuse emojis."),
          ]
          changed = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in suffixes or path.name == "AndroidManifest.xml":
                  continue
              try:
                  before = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              after = before
              for old, new in replacements:
                  after = after.replace(old, new)
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  changed.append(str(path))
          print("Updated feminine persona/voice in:", *changed, sep=" | ")
          PY
          echo "---- FIX VISIBLE NOTIFICATION BRANDING ----"
          python3 scripts/fix_mansi_notifications.py
          echo "---- APPLY MANSI FULL APP VISUAL REDESIGN (NO THEME PICKER) ----"
          python3 scripts/apply_mansi_full_redesign.py
          echo "---- APPLY MANSI HEART ORB ----"
          python3 scripts/apply_mansi_orb.py
          echo "---- INSTALL CUTE ANIME GIRL IN CENTER ORB (KEEP PINK HEART) ----"
          python3 scripts/apply_mansi_anime_avatar.py
          echo "---- ADD MANSI AVATAR EXPRESSIONS, GAZE AND VOICE-REACTIVE MOUTH ----"
          python3 scripts/add_mansi_avatar_lipsync.py
          echo "---- ADD NATIVE TAP RIPPLE FEEDBACK TO ACTIONABLE UI ----"
          python3 scripts/add_mansi_tap_feedback.py
          grep -n "MANSI_FINAL_HOLOGRAM_ORB_V3" source/mansi/app/src/main/assets/orb.html
          echo "---- APPLY REQUESTED MANSI AI / SAGAR BRANDING ----"
