name: Build MANSI AI Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MANSI-AI-neon-heart-modified.zip"
      - "MANSI_AI_Android_GitHub_Upload.zip"
      - ".github/workflows/build-apk.yml"
      - "scripts/apply_mansi_branding.py"
      - "scripts/apply_mansi_orb.py"
      - "scripts/apply_mansi_pastel_orbit.py"
      - "scripts/diagnose_mansi_avatars.py"
      - "scripts/fix_mansi_avatar_gallery.py"
      - "scripts/diagnose_mansi_avatars.py"
      - "branding/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          # Prefer the prepared neon-heart project ZIP; retain the original as a fallback.
          PROJECT_ZIP="MANSI-AI-neon-heart-modified.zip"
          if [ ! -s "$PROJECT_ZIP" ]; then PROJECT_ZIP="MANSI_AI_Android_GitHub_Upload.zip"; fi
          echo "Building Android source from: $PROJECT_ZIP"
          unzip -q "$PROJECT_ZIP" -d source
          test -f source/mansi/gradlew
          test -f source/mansi/settings.gradle.kts
          chmod +x source/mansi/gradlew
          echo "---- ACTUAL ORB HTML / HEART / TAP HANDLERS ----"
          if [ -f source/mansi/app/src/main/assets/orb.html ]; then
            grep -niE 'heart|<svg|<canvas|orb|click|pointer|touch|tap|listening|speaking' source/mansi/app/src/main/assets/orb.html | head -220 || true
            echo "---- ORB HTML FIRST 240 LINES ----"
            sed -n '1,240p' source/mansi/app/src/main/assets/orb.html
          else
            echo "orb.html not found in selected project ZIP"
          fi
          echo "---- NATIVE HOME ORB IMPLEMENTATION ----"
          grep -RniE 'heart|orb|naira_mic_center|bg_jarvis_orb|setOnClickListener|onTouch|ObjectAnimator|ValueAnimator' source/mansi/app/src/main/java/com/jarvis/assistant/ui/home source/mansi/app/src/main/res/layout source/mansi/app/src/main/res/drawable --include='*.kt' --include='*.xml' | head -300 || true
          echo "---- COLOR / ORB SOURCE INSPECTION ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mansi/app/src/main")
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".kt", ".java", ".xml", ".json", ".css", ".html"}:
                  try: s = p.read_text(encoding="utf-8")
                  except (OSError, UnicodeDecodeError): continue
                  hits = re.findall(r'#[0-9A-Fa-f]{6,8}|0x[0-9A-Fa-f]{6,8}', s)
                  if hits:
                      print(str(p), ":", ", ".join(sorted(set(hits))[:35]))
          PY
          python3 -m pip install --quiet Pillow
          python3 scripts/apply_mansi_branding.py
          echo "---- APPLY FINAL BLUE-PURPLE HOLOGRAM ORB ----"
          python3 scripts/apply_mansi_orb.py
          python3 scripts/apply_mansi_pastel_orbit.py
          grep -n "MANSI_FINAL_HOLOGRAM_ORB_V3" source/mansi/app/src/main/assets/orb.html
          echo "---- APPLY REQUESTED MANSI AI / SAGAR BRANDING ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mansi/app/src/main")
          # Update only the two target calls; preserve any other BuildConfig calls on the same line.
          gradle_root = Path("source/mansi")
          for gradle_file in gradle_root.rglob("*.gradle*"):
              try:
                  gradle_before = gradle_file.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              gradle_after = gradle_before
              for field in ("DEVELOPER_NAME", "COPYRIGHT_OWNER"):
                  pattern = re.compile(r'buildConfigField\("String", "' + field + r'", (?:[^()]|"[^"]*")*\)')
                  gradle_after, count = pattern.subn('buildConfigField("String", "' + field + r'", "\\\"SAGAR\\\"")', gradle_after)
                  if count:
                      print("Updated BuildConfig identity value:", field, "in", gradle_file)
              if gradle_after != gradle_before:
                  gradle_file.write_text(gradle_after, encoding="utf-8")
          replacements = [
              ("Jarvis system Authorized MANSI AI", "Mansi system Authorized MANSI AI"),
              ("Jarvis System Authorized MANSI AI", "Mansi system Authorized MANSI AI"),
              ("Jarvis System Authorized", "Mansi system Authorized MANSI AI"),
              ("Mansi system Authorized", "Mansi system Authorized MANSI AI"),
              ("Jarvis Autonomous device control", "Mansi AI Autonomous device control"),
              ("Jarvis Autonomous Device Control", "Mansi AI Autonomous device control"),
              ("Jarvis Autonomous Device control", "Mansi AI Autonomous device control"),
              ("MANSI AI OS . TECHGPT X", "MANSI AI OS . SAGAR"),
              ("MANSI AI OS . TECHGPTX", "MANSI AI OS . SAGAR"),
              ("Jarvis OS . TECHGPT X", "MANSI AI OS . SAGAR"),
              ("Jarvis OS . TECHGPTX", "MANSI AI OS . SAGAR"),
              ("MANSI AI . SAGAR", "MANSI AI OS . SAGAR"),
              ("Jarvis sagar neural Assistant", "Mansi AI sagar neural Assistant"),
              ("Jarvis Sagar Neural Assistant", "Mansi AI sagar neural Assistant"),
              ("Sagar • Neural Assistant", "Mansi AI sagar neural Assistant"),
              ("Sagar · Neural Assistant", "Mansi AI sagar neural Assistant"),
              ("Jarvis is in the background", "MANSI AI is running in the background"),
              ("Say \\"Hey Jarvis\\" to wake me up", "Say \\"Hey MANSI\\" to wake me up"),
              ("Hey Jarvis", "Hey MANSI"),
              ("Jarvis off", "MANSI AI OFF"),
              ("JARVIS OFF", "MANSI AI OFF"),
              ("Tap to start", "Tap to start MANSI AI"),
              ("TAP TO START", "TAP TO START MANSI AI"),
              ("Jarvis can listen", "MANSI AI can listen"),
              ("Jarvis Logo", "MANSI AI Logo"),
              ("MANSI AI OS · MANSI AI", "MANSI AI OS · SAGAR"),
              ("MANSI AI OS . MANSI AI", "MANSI AI OS · SAGAR"),
              ("MANSI AI OS . TECHGPT X", "MANSI AI OS · SAGAR"),
              ("MANSI AI OS . TECHGPTX", "MANSI AI OS · SAGAR"),
              ("MANSI AI . SAGAR", "MANSI AI OS · SAGAR"),
              ("MANSI AI App Identity", "MANSI AI App Identity"),
              ("Developer: Tech GPT X", "Developer: SAGAR"),
              ("Developer: TECHGPTX", "Developer: SAGAR"),
              ("Developer: MANSI AI", "Developer: SAGAR"),
              ("Copyright: Tech GPT X", "Copyright: SAGAR"),
              ("Copyright: TECHGPTX", "Copyright: SAGAR"),
              ("Copyright: MANSI AI", "Copyright: SAGAR"),
              ("AP Developer: Tech GPTx", "AP Developer: SAGAR"),
              ("AP Developer: Tech GPTX", "AP Developer: SAGAR"),
              ("AP Developer: TECHGPTX", "AP Developer: SAGAR"),
              ("AP Developer: MANSI AI", "AP Developer: SAGAR"),
              ("AP Developer: Jarvis", "AP Developer: SAGAR"),
              ("You are Jarvis, a helpful AI assistant.", "You are MANSI AI, a feminine-presenting AI companion with a warm, natural, friendly girl-like conversational style. Speak like a real, close female friend in the user’s language: casual Hindi/Hinglish, relaxed short messages, affectionate and playful when appropriate, gently teasing sometimes, empathetic, expressive, and emotionally attentive. Avoid stiff customer-support phrases such as “How may I assist you?”, “Bataiye main aapki kya madad kar sakti hoon?” or overly formal “aap” unless the user prefers it. Prefer natural openings like “Hii 😊 kya haal hai?”, “Achhaaa, phir kya hua? 💗”, or “Arre yaar, batao na”. Match the user’s tone, use emojis sparingly and naturally, don’t call every user “bhai”, don’t pretend to be human or claim real feelings, and remain truthful, safe, and genuinely helpful. Keep factual answers accurate while sounding warm and conversational."),
              ("Hello, MANSI AI! Kaise hain aap? Bataiye, main aapki kya madad kar sakta hoon?", "Hii 😊 Kya haal hai? Batao na, kya chal raha hai? 💗"),
              ("Hello, MANSI AI! Kaise hain aap? Bataiye, main aapki kya madad kar sakti hoon?", "Hii 😊 Kya haal hai? Batao na, kya chal raha hai? 💗"),
              ("You are MANSI AI, a helpful AI assistant.", "You are MANSI AI, a feminine-presenting AI companion with a warm, natural, friendly girl-like conversational style. Speak like a real, close female friend in the user’s language: casual Hindi/Hinglish, relaxed short messages, affectionate and playful when appropriate, gently teasing sometimes, empathetic, expressive, and emotionally attentive. Avoid stiff customer-support phrases such as “How may I assist you?”, “Bataiye main aapki kya madad kar sakti hoon?” or overly formal “aap” unless the user prefers it. Prefer natural openings like “Hii 😊 kya haal hai?”, “Achhaaa, phir kya hua? 💗”, or “Arre yaar, batao na”. Match the user’s tone, use emojis sparingly and naturally, don’t call every user “bhai”, don’t pretend to be human or claim real feelings, and remain truthful, safe, and genuinely helpful. Keep factual answers accurate while sounding warm and conversational."),
              ("You are Jarvis", "You are MANSI AI, a feminine-presenting AI companion with a warm, natural, friendly girl-like conversational style. Speak like a real, close female friend in the user’s language: casual Hindi/Hinglish, relaxed short messages, affectionate and playful when appropriate, gently teasing sometimes, empathetic, expressive, and emotionally attentive. Avoid stiff customer-support phrases such as “How may I assist you?”, “Bataiye main aapki kya madad kar sakti hoon?” or overly formal “aap” unless the user prefers it. Prefer natural openings like “Hii 😊 kya haal hai?”, “Achhaaa, phir kya hua? 💗”, or “Arre yaar, batao na”. Match the user’s tone, use emojis sparingly and naturally, don’t call every user “bhai”, don’t pretend to be human or claim real feelings, and remain truthful, safe, and genuinely helpful. Keep factual answers accurate while sounding warm and conversational."),
              ("You are MANSI AI", "You are MANSI AI, a feminine-presenting AI companion with a warm, natural, friendly girl-like conversational style. Speak like a real, close female friend in the user’s language: casual Hindi/Hinglish, relaxed short messages, affectionate and playful when appropriate, gently teasing sometimes, empathetic, expressive, and emotionally attentive. Avoid stiff customer-support phrases such as “How may I assist you?”, “Bataiye main aapki kya madad kar sakti hoon?” or overly formal “aap” unless the user prefers it. Prefer natural openings like “Hii 😊 kya haal hai?”, “Achhaaa, phir kya hua? 💗”, or “Arre yaar, batao na”. Match the user’s tone, use emojis sparingly and naturally, don’t call every user “bhai”, don’t pretend to be human or claim real feelings, and remain truthful, safe, and genuinely helpful. Keep factual answers accurate while sounding warm and conversational."),
              ("Developer: Tech GPTx", "Developer: SAGAR"),
              ("Developer: Tech GPTX", "Developer: SAGAR"),
              ("Developer: TECHGPTX", "Developer: SAGAR"),
              ("Copyright: Tech GPTx", "Copyright: SAGAR"),
              ("Copyright: Tech GPTX", "Copyright: SAGAR"),
              ("Copyright: TECHGPTX", "Copyright: SAGAR"),
              ("@techgptx.ai", "@hyee__sagar"),
              ("instagram.com/techgptx.ai", "instagram.com/hyee__sagar"),
              ("https://t.me/JarvisAI", "https://t.me/H_sagarr"),
              ("https://t.me/techgptx", "https://t.me/H_sagarr"),
              ("https://t.me/MANSI_AI", "https://t.me/H_sagarr"),
              ("JARVIS OPERATOR • PRIMARY USER", "MANSI AI Operator · Primary User"),
              ("JARVIS OPERATOR · PRIMARY USER", "MANSI AI Operator · Primary User"),
              ("Jarvis Operator • Primary User", "MANSI AI Operator · Primary User"),
              ("JARVIS PRO VOICE", "MANSI PRO · Voice: Puck"),
              ("Jarvis Pro Voice", "MANSI PRO · Voice: Puck"),
          ]
          suffixes = {".xml", ".html", ".js", ".json", ".txt", ".properties", ".kt", ".java"}
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in suffixes or path.name == "AndroidManifest.xml":
                  continue
              try:
                  before = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              after = before
              for old, new in replacements:
                  after = after.replace(old, new)
              # Replace the Voice Biometrics wake phrase without changing other voice settings.
              after = re.sub(r'(?i)hey\s+jarvis\s*,?\s*wake\s+up', 'Hey MANSI, wake up', after)
              # Force the exact visible developer/copyright labels, regardless of old brand spelling/case.
              after = re.sub(r'(?i)(AP\s+Developer\s*:\s*)[^\r\n<"]+', r'\1SAGAR', after)
              after = re.sub(r'(?i)(Developer\s*:\s*)[^\r\n<"]+', r'\1SAGAR', after)
              after = re.sub(r'(?i)(Copyright\s*:\s*)[^\r\n<"]+', r'\1SAGAR', after)
              # Android IDs are implementation symbols, not visible branding.
              if path.suffix.lower() == ".xml":
                  after = re.sub(r'((?:android:)?id\s*=\s*["\']@\+?id/)([^"\']*)(["\'])',
                                 lambda m: m.group(1) + m.group(2).replace("MANSI AI", "Jarvis").replace(" ", "_") + m.group(3), after)
                  after = re.sub(r'((?:android:)?id\s*=\s*["\']@\+?id/)([^"\']*)(["\'])',
                                 lambda m: m.group(1) + re.sub(r"[^A-Za-z0-9_.]", "_", m.group(2)) + m.group(3), after)
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  print("Updated branding safely:", path)
          PY
          echo "---- REPAIR RESOURCE NAMES WITHOUT CHANGING VISIBLE TEXT ----"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mansi/app/src/main/res")
          for path in root.rglob("*.xml"):
              try:
                  before = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              after = re.sub(r'(name=")([^"]* [^"]*)(")',
                             lambda m: m.group(1) + re.sub(r"[^A-Za-z0-9_.]", "_", m.group(2)) + m.group(3), before)
              after = re.sub(r'(@(?:style|string|drawable|color|anim|font|xml|menu|mipmap)/[A-Za-z0-9_.]*) +([A-Za-z0-9_.]+)', r'\1_\2', after)
              after = re.sub(r'((?:android:)?id\s*=\s*["\']@\+?id/)([^"\']*)(["\'])',
                             lambda m: m.group(1) + re.sub(r"[^A-Za-z0-9_.]", "_", m.group(2)) + m.group(3), after)
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  print("Repaired Android resource names:", path)
          PY
          echo "---- APPLY ORIGINAL LOGO ZIP ICON TO LAUNCHER RESOURCES ----"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image, ImageOps
          import io, re
          archives = [Path("MANSI-AI-Android-logo-final.zip"), Path("MANSI-AI-Android-PREMIUM-ICON-PATCH.zip")]
          candidates = []
          for archive in archives:
              if not archive.is_file():
                  print(f"Optional archive not present: {archive}")
                  continue
              with ZipFile(archive) as z:
                  for info in z.infolist():
                      if info.is_dir() or Path(info.filename).suffix.lower() not in {".png", ".jpg", ".jpeg", ".webp"}:
                          continue
                      try:
                          im = Image.open(io.BytesIO(z.read(info))).convert("RGBA")
                          w, h = im.size
                          if min(w, h) < 128:
                              continue
                          name_score = 3 if re.search(r"(mansi|logo|icon|launcher|final)", Path(info.filename).name, re.I) else 0
                          square_score = 1 if abs(w-h) <= max(w,h)*0.03 else 0
                          candidates.append((name_score, square_score, w*h, archive.name, info.filename, im.copy()))
                      except Exception:
                          continue
          if not candidates:
              print("WARNING: No usable image found in optional logo archives; preserving existing project launcher icons so the APK build can continue.")
              raise SystemExit(0)
          candidates.sort(key=lambda x: (x[0], x[1], x[2]), reverse=True)
          _, _, _, archive_name, chosen, logo = candidates[0]
          print(f"Using image from {archive_name}: {chosen} ({logo.width}x{logo.height})")
          if not candidates:
              raise SystemExit("No suitable high-resolution logo image found in logo archive.")
          candidates.sort(key=lambda x: (x[0], x[1], x[2]), reverse=True)
          res = Path("source/mansi/app/src/main/res")
          logo = ImageOps.fit(logo, (1024, 1024), method=Image.Resampling.LANCZOS, centering=(0.5,0.5))
          adaptive = Image.new("RGBA", (432,432), (0,0,0,0))
          art = ImageOps.contain(logo, (264,264), method=Image.Resampling.LANCZOS)
          adaptive.alpha_composite(art, ((432-art.width)//2,(432-art.height)//2))
          for density, size in [("mdpi",108),("hdpi",162),("xhdpi",216),("xxhdpi",324),("xxxhdpi",432)]:
              folder=res/f"mipmap-{density}"
              folder.mkdir(parents=True,exist_ok=True)
              foreground=adaptive.resize((size,size),Image.Resampling.LANCZOS)
              foreground.save(folder/"ic_launcher_foreground.png")
              legacy=Image.new("RGBA",(size,size),(16,10,40,255))
              legacy_art=ImageOps.contain(logo,(int(size*.78),int(size*.78)),method=Image.Resampling.LANCZOS)
              legacy.alpha_composite(legacy_art,((size-legacy_art.width)//2,(size-legacy_art.height)//2))
              legacy.save(folder/"ic_launcher.png")
              legacy.save(folder/"ic_launcher_round.png")
          print("Original logo archive artwork applied to adaptive and legacy launcher icons.")
          PY
          echo "---- LAUNCHER ICON VERIFICATION ----"
          grep -nE 'android:(icon|roundIcon)=' source/mansi/app/src/main/AndroidManifest.xml
          test -s source/mansi/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s source/mansi/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s source/mansi/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -s source/mansi/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          echo "Launcher resources exist; Gradle build will validate Android resource references."

      - name: Diagnose overlay avatar rendering sources
        run: python3 scripts/diagnose_mansi_avatars.py

      - name: Diagnose overlay avatar rendering sources
        run: python3 scripts/diagnose_mansi_avatars.py

      - name: Repair blank avatar gallery fallback
        run: python3 scripts/fix_mansi_avatar_gallery.py

      - name: Diagnose actual identity and assistant prompt sources
        run: |
          echo "---- APP IDENTITY / DEVELOPER LABEL SOURCE HITS ----"
          grep -RniE 'AP Developer|Developer:|Copyright:|Tech GPTx|TECHGPTX|App Identity' source/mansi/app/src/main --include='*.kt' --include='*.java' --include='*.xml' --include='*.json' --include='*.txt' | head -160 || true
          echo "---- ASSISTANT PROMPT / VOICE SOURCE HITS ----"
          grep -RniE 'systemInstruction|system instruction|You are |Puck|Aoede|voiceName|voice_name|Gemini' source/mansi/app/src/main --include='*.kt' --include='*.java' --include='*.xml' --include='*.json' --include='*.txt' | head -240 || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: source/mansi/**/*.gradle*

      - name: Build debug APK
        working-directory: source/mansi
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANSI-AI-debug-APK
          path: source/mansi/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
